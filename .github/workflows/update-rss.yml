name: Generate Custom RSS

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # 毎日 日本時間 5:00, 9:00, 12:00, 16:00, 20:00 に実行 (UTC指定: 20:00, 0:00, 3:00, 7:00, 11:00)
    # ※注: JST(UTC+9)に合わせるためcronの時間を修正しました
cron: '0 20,0,3,7,11 * * *'
  workflow_dispatch: # 手動実行用ボタンも有効化

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ★ 追加: Hugging Faceモデルのキャッシュ ★
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-hf-model-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-hf-model-

      - name: Run main script
        env:
          # ★ 修正: Python側の os.environ.get("...") と変数名を一致させました
          API_KEY1: ${{ secrets.API_KEY1 }}
          HF_TOKEN1: ${{ secrets.HF_TOKEN1 }}
        run: |
          python main.py

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # ルートディレクトリ全体（rss.xmlを含む）をアップロード

  deploy:
    needs: build-and-deploy
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4