name: Generate Custom RSS

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  # 定期実行を無効化する場合はブロックごとコメントアウトします
  # schedule:
  #   - cron: '11 0,1,6,20 * * *'
  workflow_dispatch: # 手動実行用ボタン有効化

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache processed URLs
        uses: actions/cache@v4
        with:
          path: processed_urls.json
          key: processed-urls-${{ github.run_id }}
          restore-keys: |
            processed-urls-

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-hf-model-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-hf-model-

      - name: Run main script
        env:
          API_KEY1: ${{ secrets.API_KEY1 }}
          HF_TOKEN1: ${{ secrets.HF_TOKEN1 }}
        run: |
          python main.py

      # ★修正ポイント: Pages用のディレクトリを作成して必要なファイルだけを移動
      - name: Prepare Pages directory
        run: |
          mkdir public
          # もし main.py が rss.xml を出力するなら public にコピー
          # 他に公開したいファイル(index.html等)があればここに追加
          cp rss.xml public/ || echo "rss.xml not found!"

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public' # '.' ではなく公開用ディレクトリを指定

  deploy:
    needs: build-and-deploy
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4